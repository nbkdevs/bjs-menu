[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bjs-menu-nutrition"
version = "1.0.0"
description = "Offline BJ's Restaurant meal builder: total calories, protein, carbs, fat and sodium, flag missing values, filter by calories and allergens."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BJ's Menus" }]
keywords = ["bjs", "menu", "nutrition", "calories", "meal-builder", "allergens", "macros"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://bjsmenus.com/"
Documentation = "https://bjsmenus.com/"
Repository = "https://github.com/nbkdevs/bjs-menu"
Issues = "https://github.com/nbkdevs/bjs-menu/issues"

[project.scripts]
bjs-menu-nutrition = "bjs_menu_nutrition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bjs_menu_nutrition = ["menu.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
